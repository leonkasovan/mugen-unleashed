;-------------------------------------------------------
; mugen.cfg -- PS Vita defaults
;
; Packed as data/mugen.psvita.cfg, verbatim: no build step and no command-line
; flag rewrites a value in this file. Edit it and rebuild.
;
; The engine merges it over the game tree's own data/mugen.cfg, PER KEY
; (src/configmerge.c): a key named here wins, a key that is not named here keeps
; the game's value, and a group only this file has is appended. The game's file
; is never modified, so it stays the user's -- the port only supplies what the
; device needs.
;
; Composition rules:
;   [Options], [P<n> Keys], [P<n> Joystick], [P<n> Gamepad], [Sound] volumes and
;   [Input] p<n>.joystick.type are IGNORED here. The options screen writes them
;   back into data/mugen.cfg, so a value forced here would be reverted on the
;   next boot. Set them in the game's config instead; the blocks below are kept
;   only as documentation of the defaults.
;-------------------------------------------------------
[Debug]
Debug = 0
; Port addition: prefix every mugen.log line with the local wall clock
; and log the session date. On here (the console has no log-comparison
; workflow); the desktop builds leave it off so their mugen.log stays
; diffable against the original.
TimeStamps = 1
ShowFPS = 1

[Options]
; Ignored: owned by the options screen (see the header).
GameSpeed = 0

[Config]
GameWidth = 960
GameHeight = 544
GameSpeed = 60
FirstRun = 0

[Video]
Width = 960
Height = 544
RenderMode = OpenGL
FullScreen = 1
KeepAspect = 1
SafeMode = 0

[Misc]
Precache = 0
