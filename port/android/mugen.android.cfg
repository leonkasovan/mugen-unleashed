;-------------------------------------------------------
; mugen.cfg -- Android defaults (platform overlay)
;
; Packed as data/mugen.android.cfg and merged over the game tree's own
; data/mugen.cfg at start-up, PER KEY (src/configmerge.c, CONFIG_PORT_PATH for
; ANDROID_PORT): a key named here wins, a key that is not named here keeps the
; game's value, and a group only this file has is appended. The game's file is
; never modified, so it stays the user's -- the port only supplies what the
; device needs.
;
; This is the same mechanism the PS Vita uses (port/psvita/mugen.psvita.cfg).
; It replaces nothing: port/android/mugen.cfg is still the full config the build
; stages as data/mugen.cfg, and this file only overrides the few keys whose
; right value depends on the hardware. Keeping them separate means a game tree
; with its own resolution or renderer choice still gets the device's screen
; size, and the options screen's saved values are untouched.
;
; Composition rules:
;   [Options], [P<n> Keys], [P<n> Joystick], [P<n> Gamepad], [Sound] volumes and
;   [Input] p<n>.joystick.type are IGNORED here. The options screen writes them
;   back into data/mugen.cfg, so a value forced here would be reverted on the
;   next boot. Set them in the game's config instead.
;-------------------------------------------------------

[Debug]
; The Android port has no log-comparison workflow, so the wall clock is free
; information: it is what makes a logcat-timestamped report match mugen.log.
TimeStamps = 1
; The frame counter in the corner, and with it the once-a-second perf line in
; mugen.log (Game_PerfLog runs when ShowFPS or Verbose is on). On a handheld the
; counter is the quickest way to see a stage that does not hold 60.
ShowFPS = 1

[Config]
; The device's own panel, not a desktop's 1280x720. This is what
; android_video.c presents into; a larger game buffer is scaled up and costs
; fill rate for nothing.
;
; These are the defaults for a 16:9 handheld. A 4:3-ish device can keep
; SystemFit = 1 below and only GameHeight changes with the stage's localcoord.
GameWidth = 1280
GameHeight = 720
; 1 opens the licence panel and then rewrites data/mugen.cfg, which the APK's
; asset tree cannot always do. The build ships 0 in its own file already; it is
; repeated here so a game tree carrying FirstRun = 1 cannot undo it.
FirstRun = 0

[Video]
; RenderMode = OpenGL is the GLES 3.0 backend (RENDERING_PLAN.md 12); System is
; the software renderer presenting through SDL2's SDL_Renderer and is the
; fallback. OpenGLScreen is not implemented on Android and falls back to System.
RenderMode = OpenGL
; A handheld is always full screen; windowed mode only adds SDL2 window
; bookkeeping on a device with no window manager.
FullScreen = 1
; Keep the panel's aspect. Off would stretch a 4:3 stage to the panel width.
KeepAspect = 1
; Let each screen keep GameWidth and re-derive its height from its own
; localcoord (motif/select 1280x720 -> 1280x720, a 4:3 stage -> 1280x960).
; Turning this off makes GameWidth/GameHeight the buffer for every screen and
; crops a 4:3 stage vertically by about 25%.
SystemFit = 1
StageFit = 1

[Misc]
; Precaching loads players during menus. It is disabled under RenderMode=OpenGL
; by the engine itself, so leaving it at the tree's value changes nothing on
; the GL path; stated here so the intent is visible.
Precache = 1
