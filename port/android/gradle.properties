# Gradle daemon memory. The engine's CMake build is the memory-hungry part
# (zlib + libpng + Lua + minizip in one shared object), not Gradle itself.
org.gradle.jvmargs=-Xmx2048m

android.useAndroidX=true
android.enableJetifier=true

# Gradle 8.x requires Java 17. The JDK path is deliberately NOT set here --
# hardcoding it would break every other machine.
#
# Note for anyone tempted to "fix" a Java version error here: neither
# org.gradle.java.home in this file, nor in local.properties, nor -D on the
# gradlew command line, can rescue an older launcher JVM -- all are read after
# the launcher has started. build.sh sets JAVA_HOME (which it does honour) and
# verifies the version. See port/android/REVIEW.md section 4.1.
