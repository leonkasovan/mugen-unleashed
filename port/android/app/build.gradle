// =============================================================================
// mugen-unleashed — Android app module
//
// Mirrors the shape of ikemen-droid's app/build.gradle (the reference build),
// with the engine differences noted inline.
// =============================================================================
apply plugin: 'com.android.application'

// =============================================================================
// Release signing (H3 in REVIEW.md)
//
// The release APK used to be signed with the PUBLIC debug key, which cannot ship
// on Play and produces a different identity on every machine (breaking updates).
// A real config is read from the environment, matching the reference build
// (ikemen-develop-update/tools/generate_android_via_native.sh):
//
//     ANDROID_KEYSTORE       path to a .jks / .keystore
//     ANDROID_KEYSTORE_PASS  store password
//     ANDROID_KEY_ALIAS      key alias            (default: androidkey)
//     ANDROID_KEY_PASS       key password         (default: store password)
//
// If they are absent the release variant falls back to debug signing and says
// so, so a local build still works and nobody mistakes its output for a
// distributable.
// =============================================================================
def releaseKeystore = System.getenv('ANDROID_KEYSTORE')
def haveReleaseKey = releaseKeystore != null && !releaseKeystore.isEmpty() && file(releaseKeystore).exists()

android {
    namespace "org.mugen_unleashed.mugen"
    compileSdkVersion 34
    buildToolsVersion "33.0.1"  // AGP 8.1 default; bootstrap installs this exact version.
    ndkVersion "27.1.12297006"
    // build.sh validates the revision and passes an optional external NDK path.
    def selectedNdkPath = project.findProperty('mugenNdkPath')
    if (selectedNdkPath) {
        ndkPath selectedNdkPath
    }

    defaultConfig {
        applicationId "org.mugen_unleashed.mugen"
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.1.0"

        // 64-bit only. The engine is C with no 32-bit assumptions that would
        // benefit from an armeabi-v7a build, and one ABI keeps the APK small;
        // add 'armeabi-v7a' here and build the engine for it if needed.
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                // The engine tree is 64-bit clean (it is built for x86-64 Linux
                // and for the Vita's ARM), so no -m32 style flags are needed.
                // The SDL2 include path is supplied by build.sh through
                // -Psdl2IncludeDir (SDL2 is cross-compiled separately, not
                // vendored, so its headers are outside this project).
                // Both cross-compiled dependency directories come from build.sh
                // through -P properties; neither library is vendored here.
                arguments "-DCMAKE_BUILD_TYPE=Release",
                          "-Dsdl2IncludeDir=" + (project.findProperty('sdl2IncludeDir') ?: ''),
                          "-Dsdl2MixerTtfDir=" + (project.findProperty('sdl2MixerTtfDir') ?: ''),
                          // M8: the GLES 3.0 renderer (RENDERING_PLAN.md section 12).
                          // Off unless build.sh --gles passes mugenGles=true.
                          "-DMUGEN_GLES=" + (project.findProperty('mugenGles') ?: 'OFF'),
                          "-DMUGEN_MODEL3D=" + (project.findProperty('mugenModel3d') ?: 'OFF')
                cFlags "-O2"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/src/CMakeLists.txt"
            version "3.22.1"
        }
    }

    aaptOptions {
        /*
         * M.U.G.E.N data files are already compressed (SFF/SND) or are parsed by
         * the engine directly. Compressing them again in the APK wastes
         * extraction time on first run and, for .zip archives that the engine
         * reads with minizip, double-compression is actively wrong.
         */
        noCompress 'sff', 'snd', 'def', 'air', 'cns', 'cmd', 'st', 'stc', 'txt', 'cfg',
                   'lua', 'ttf', 'fnt', 'font', 'zip', 'mp3', 'ogg', 'wav'
    }

    sourceSets.main {
        // libmain.so and libSDL2.so are staged here by build.sh.
        jniLibs.srcDir 'src/main/jniLibs'
        assets.srcDirs = ['src/main/assets']
    }

    // Launcher icons derived from res/icons by build.sh
    // (tools/make_android_icons.sh). They go into the debug and release source
    // sets rather than main on purpose: a buildType's res directory *overrides*
    // main instead of colliding with it, so the freshly generated PNGs win over
    // the committed fallback copies under src/main/res (mipmap-<density>, one
    // directory per bucket). A plain `gradlew assembleDebug` (no build.sh, no
    // Python) simply finds no generated directory and uses the committed ones.
    def generatedIcons = file("$buildDir/generated/res/mugen-icons")
    if (generatedIcons.directory) {
        sourceSets.debug.res.srcDir generatedIcons
        sourceSets.release.res.srcDir generatedIcons
    }

    if (haveReleaseKey) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASS') ?: ''
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'androidkey'
                keyPassword System.getenv('ANDROID_KEY_PASS')
                    ?: (System.getenv('ANDROID_KEYSTORE_PASS') ?: '')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (haveReleaseKey) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            debuggable true
        }
    }

    packagingOptions {
        // SDL2 ships its own licence file; a duplicate breaks the merge.
        jniLibs {
            useLegacyPackaging true   // keeps .so extractable on older devices
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // The engine links SDL2 dynamically (see the CMakeLists); everything else,
    // including zlib, libpng, Lua and minizip, is compiled from third_party/.
}

// =============================================================================
// Asset manifest
//
// SDL2's Android asset API cannot enumerate a directory, so the set of files to
// extract on first run is baked into the APK as assets/manifest.txt. Generating
// it here, rather than in build.sh, keeps it in step with whatever is actually
// in src/main/assets.
// =============================================================================
task generateAssetManifest {
    def assetsDir = file("src/main/assets")
    def manifest = new File(assetsDir, "manifest.txt")

    inputs.dir assetsDir
    outputs.file manifest

    doLast {
        // B6: the manifest carries size + FNV-1a per file so extraction can
        // verify rather than trust `stat`. FNV-1a (not SHA-256) because the
        // native side has no crypto library; 64 bits is plenty for
        // accidental-truncation detection. payload.txt holds the generation
        // hash; the native side re-extracts when it differs (upgrade) instead
        // of trusting a static v1 stamp.
        def lines = []
        assetsDir.eachFileRecurse { f ->
            if (f.isFile() && !f.name.equals("manifest.txt") && !f.name.equals("payload.txt")) {
                def rel = assetsDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                def bytes = f.bytes
                long h = 0xcbf29ce484222325L
                bytes.each { b -> h = ((h ^ (b & 0xFF)) * 0x100000001b3L) & 0xFFFFFFFFFFFFFFFFL }
                // size and hash first (neither contains spaces); the path runs
                // to end-of-line so game content with spaces parses exactly.
                lines << "${bytes.length} ${String.format('%016x', h)} ${rel}"
            }
        }
        lines.sort()
        manifest.text = lines.join('\n') + (lines.isEmpty() ? '' : '\n')
        def payloadMd = java.security.MessageDigest.getInstance("SHA-256")
        def payload = payloadMd.digest(manifest.text.bytes).encodeHex().toString()
        new File(assetsDir, "payload.txt").text = payload + '\n'
        println "manifest.txt: ${lines.size()} asset(s), payload ${payload.take(12)}"
    }
}

preBuild.dependsOn generateAssetManifest

// =============================================================================
// Warn loudly when a "release" build is about to be debug-signed.
// =============================================================================
gradle.taskGraph.whenReady { graph ->
    boolean buildingRelease = graph.allTasks.any { it.name.toLowerCase().contains('release') }
    if (buildingRelease && !haveReleaseKey) {
        logger.warn("")
        logger.warn("WARNING: building a RELEASE APK signed with the DEBUG keystore.")
        logger.warn("         It installs and runs, but it is not distributable and will not")
        logger.warn("         update over a build made on another machine.")
        logger.warn("         Set ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS and")
        logger.warn("         ANDROID_KEY_PASS to sign properly.")
        logger.warn("")
    }
}
