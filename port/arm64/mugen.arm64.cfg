; Linux ARM64 platform overlay, merged over data/mugen.cfg per key.
; Install beside the game's config as data/mugen.arm64.cfg.
[Sound]
; Decode character sounds on demand; cold decoding is synchronous.
Snd.LazyDecode = 1
Snd.Cache.AutoGrow = 1
; Decoded PCM budgets in MiB; playing/prepared sounds can exceed the ceiling.
Snd.Cache.InitialMB = 8
Snd.Cache.MaxMB = 20
