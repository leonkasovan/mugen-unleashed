name: SDL2 build
on:
  push:
    branches: [main, sdl2]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 development dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev libpng-dev zlib1g-dev libglu1-mesa-dev
      - name: Build desktop GL and GLES
        run: |
          make -j2
          make -j2 MUGEN_GLES=1 BUILD=build/linux-gles
          python3 tools/check_sdl2_only.py --binary build/linux-x64-sdl2/mugen-linux-x64
      - name: Run SDL2 regression tests
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
          sh tools/test_zoomdiff.sh
          sh tools/test_render_baseline.sh
          sh tools/test_sdl2helpers.sh
          sh tools/test_sdl2input.sh
          sh tools/test_sdl2audio.sh
          sh tools/test_perf.sh
          sh tools/test_batchprof.sh
          sh tools/test_gl_errors.sh
          sh tools/test_model.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mugen-linux-x64-sdl2
          path: build/linux-x64-sdl2/mugen-linux-x64
  windows:
    name: MinGW ${{ matrix.target }} SDL2
    runs-on: windows-2022
    # Keep both kits writable and on the checkout volume; no C: root install.
    env:
      W64DEVKIT_DIR: ${{ github.workspace }}\build\toolchains\w64devkit
      X86DEVKIT_DIR: ${{ github.workspace }}\build\toolchains\x86devkit
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: [win32, win64]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependency kits and build
        shell: cmd
        run: setup.bat /build${{ matrix.target == 'win32' && '32' || '64' }}
      - name: Run profiler regressions
        shell: cmd
        run: |
          set "PATH=%W64DEVKIT_DIR%\bin;%PATH%"
          if "${{ matrix.target }}"=="win32" set "PATH=%X86DEVKIT_DIR%\bin;%PATH%"
          set "MUGEN_TEST_TARGET=${{ matrix.target }}"
          set "CC=gcc"
          set "PKG_CONFIG=pkg-config"
          set "PKG_CONFIG_LIBDIR=%CD%\build\sysroots\${{ matrix.target }}-sysroot\usr\lib\pkgconfig"
          sh tools/test_perf.sh
          sh tools/test_batchprof.sh
      - name: Check supported source/dependency contract
        shell: cmd
        run: |
          set "PATH=%W64DEVKIT_DIR%\bin;%PATH%"
          python tools/check_sdl2_only.py --binary build/${{ matrix.target == 'win32' && 'mingw-sdl2' || 'mingw64-sdl2' }}/mugen-mingw-${{ matrix.target }}-sdl2.exe
      - name: Package standalone executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/dist | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter mugen-mingw-${{ matrix.target }}-sdl2.exe | Select-Object -First 1
          if (-not $exe) { throw "SDL2 executable missing" }
          Copy-Item $exe.FullName build/dist/
          Copy-Item README.md build/dist/
          Copy-Item third_party/README.md build/dist/THIRD_PARTY.md
          Compress-Archive -Path build/dist/* -DestinationPath mugen-mingw-${{ matrix.target }}-sdl2.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mugen-mingw-${{ matrix.target }}-sdl2
          path: mugen-mingw-${{ matrix.target }}-sdl2.zip
          if-no-files-found: error
      - name: Attach standalone package to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mugen-mingw-${{ matrix.target }}-sdl2.zip
