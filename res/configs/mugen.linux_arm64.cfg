; Linux ARM64 platform overlay, merged over data/mugen.cfg per key.
; Embedded in the executable and written as data/mugen.linux_arm64.cfg when
; that file is absent (src/configembed.c), so nothing is copied into a tree.
[Config]
; Optional roster discovery (writes select.def). Commented so the game's
; mugen.cfg can enable it; uncomment to override here.
;AutoUpdateChars = 0
;AutoUpdateStages = 0

[Sound]
; Decode character sounds on demand; cold decoding is synchronous.
Snd.LazyDecode = 1
Snd.Cache.AutoGrow = 1
; Decoded PCM budgets in MiB; playing/prepared sounds can exceed the ceiling.
Snd.Cache.InitialMB = 8
Snd.Cache.MaxMB = 20

[Video]
; Optional internal resolution multiplier for ARM64 GLES (0.5 to 1.0).
; Game coordinates and window size stay the same. Lower values reduce detail.
; Default is 1.0. Uncomment to render a 640x480 game buffer at 320x240.
;RenderScale = 0.5
