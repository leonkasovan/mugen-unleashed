; Windows 64-bit platform overlay, merged over data/mugen.cfg per key.
;
; Embedded in the executable and written as data/mugen.win64.cfg when that file
; is absent (src/configembed.c), so nothing has to be copied into a game tree by
; hand. The engine merges it over data/mugen.cfg per key at start-up
; (src/configmerge.c): a key named here wins, everything else keeps the game's
; value. The game's file is never modified, so the options screen's saved
; settings stay the user's.
;
; No Windows 64-bit specific value is needed today. Add one here rather than
; editing data/mugen.cfg, so a tree with its own configuration keeps it.
